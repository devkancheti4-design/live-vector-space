name: tests

# Every push and pull request: the whole suite on Python 3.10-3.14, Linux and macOS, plus the oldest numpy
# the package allows. On 3.10-3.13 this also exercises the backports.zstd fallback.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Test
        run: python -m unittest discover -s tests -v

  oldest-numpy:
    name: Oldest numpy (1.24) on Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install
        run: python -m pip install "numpy==1.24.*" .
      - name: Test
        run: python -m unittest discover -s tests -v
