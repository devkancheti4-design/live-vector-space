name: Publish to PyPI

# Push a tag such as v0.1.0 (it must match lvs.__version__) to build, test and publish a release.
# PyPI trusts this workflow through trusted publishing, so no token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Test the wheel
        run: |
          python -m pip install dist/*.whl
          test "$GITHUB_REF_NAME" = "v$(python -c 'import lvs; print(lvs.__version__)')"
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/live-vector-space/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
